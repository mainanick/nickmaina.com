on:
  push:
    branches:
      - main
      
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build
        run: |
          pip install pipenv
          pipenv install
          pipenv run make all
      - name: Deploy
        run: echo "deploy"